[project]
name = "llm-kernel-paper-writing"
version = "0.2.0"
description = "Evidence-grounded paper writing skill for LLM-driven GPU kernel research"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "requests>=2.31,<3",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
