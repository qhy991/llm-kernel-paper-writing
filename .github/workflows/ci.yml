name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check scripts tests

      - name: Compile
        run: python -m py_compile scripts/*.py tests/*.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate example ledger
        run: |
          python scripts/validate_evidence_ledger.py \
            assets/example-solar-ledger.json --strict

      - name: Validate skill structure
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          text = Path("SKILL.md").read_text(encoding="utf-8")
          assert text.startswith("---\n")
          frontmatter = text.split("---", 2)[1]
          assert re.search(r"^name: llm-kernel-paper-writing$", frontmatter, re.M)
          assert re.search(r"^description: .+$", frontmatter, re.M)
          assert len(text.splitlines()) < 500
          PY
